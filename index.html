<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>McQueen TV</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  width:100vw;
  height:100vh;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
  background:url("fire wallpaper.jpg") center/cover no-repeat;
}

/* TV Wrapper */
.tv-container{
  position:relative;
  width:min(90vw,1200px);
}

/* SVG TV Frame */
.tv-frame{
  width:100%;
  display:block;
  position:relative;
  z-index:2;
  pointer-events:none;
}

/* Video positioning inside TV screen */
.screen-video{
  position:absolute;

  /* ADJUST THESE VALUES */
  top:18%;
  left:17%;
  width:66%;
  height:48%;

  object-fit:cover;
  border-radius:8px;
  z-index:1;

  box-shadow:
    0 0 20px red,
    0 0 50px orange;
}

/* CRT effect */
.screen-video::after{
  content:"";
}

.overlay{
  position:absolute;
  top:18%;
  left:17%;
  width:66%;
  height:48%;
  z-index:3;
  pointer-events:none;

  background:
    repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.03),
      rgba(255,255,255,0.03) 2px,
      transparent 2px,
      transparent 4px
    );
}
</style>
</head>

<body>

<div class="tv-container">

  <!-- Video -->
  <video class="screen-video" autoplay muted loop playsinline>
    <source src="video.mp4" type="video/mp4">
  </video>

  <!-- CRT overlay -->
  <div class="overlay"></div>

  <!-- Your McQueen TV SVG -->
  <img src="mv2.svg" class="tv-frame">

</div>

</body>
</html>
