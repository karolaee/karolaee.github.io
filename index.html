<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Interactive TV Widget</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        user-select: none;
    }

    html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: Arial, sans-serif;
    }

    body {
        background: url('wallpaper.jpg') center center / cover no-repeat;
    }

    /* ===== TV WIDGET ===== */

    #tv-widget {
        position: absolute;
        width: 520px;
        height: 390px;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        cursor: grab;
        z-index: 10;
    }

    #tv-widget:active {
        cursor: grabbing;
    }

    /* TV image */
    #tv-frame {
        position: absolute;
        width: 100%;
        height: 100%;
        object-fit: contain;
        pointer-events: none;
        z-index: 3;
    }

    /* Video/audio area */
    #media-container {
        position: absolute;

        /* ADJUST THESE VALUES TO FIT YOUR TV SCREEN */
        left: 80px;
        top: 70px;
        width: 360px;
        height: 200px;

        background: black;
        overflow: hidden;
        border-radius: 8px;
        z-index: 1;
    }

    /* Fake CRT effect */
    #media-container::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
            repeating-linear-gradient(
                to bottom,
                rgba(255,255,255,0.03),
                rgba(255,255,255,0.03) 1px,
                transparent 1px,
                transparent 3px
            );
        pointer-events: none;
        mix-blend-mode: screen;
    }

    /* Visualizer */
    #visualizer {
        width: 100%;
        height: 100%;
        background:
            radial-gradient(circle at center, #00ff99 0%, #001a11 70%);
        position: relative;
        overflow: hidden;
    }

    .bar {
        position: absolute;
        bottom: 0;
        width: 8px;
        background: #00ff99;
        border-radius: 4px 4px 0 0;
        animation: bounce 1s infinite ease-in-out;
    }

    @keyframes bounce {
        0% { height: 20%; }
        50% { height: 100%; }
        100% { height: 20%; }
    }

    /* PLAYER BUTTON AREA */
    #player-controls {
        position: absolute;

        /* POSITION THIS OVER YOUR SVG BUTTONS */
        left: 180px;
        top: 285px;
        width: 160px;
        height: 60px;

        z-index: 5;
    }

    #player-schema {
        width: 100%;
        height: 100%;
        object-fit: contain;
        pointer-events: none;
    }

    /* Invisible click zone */
    #play-button {
        position: absolute;

        /* BUTTON HITBOX */
        left: 45px;
        top: 8px;
        width: 70px;
        height: 40px;

        cursor: pointer;
        border-radius: 10px;
        transition: all 0.2s ease;
    }

    #play-button:hover {
        background: rgba(255,255,255,0.15);
        box-shadow: 0 0 15px rgba(255,255,255,0.5);
    }

    /* Status text */
    #status {
        position: absolute;
        bottom: -30px;
        width: 100%;
        text-align: center;
        color: white;
        font-size: 14px;
        text-shadow: 0 0 10px black;
    }

    /* Responsive */
    @media (max-width: 700px) {
        #tv-widget {
            width: 90vw;
            height: 67vw;
        }
    }
</style>
</head>

<body>

<div id="tv-widget">

    <!-- MEDIA AREA -->
    <div id="media-container">
        <div id="visualizer"></div>
    </div>

    <!-- TV FRAME -->
    <img id="tv-frame" src="mctv.png" alt="TV Frame">

    <!-- PLAYER -->
    <div id="player-controls">

        <img id="player-schema" src="player_schema.svg" alt="Player Controls">

        <div id="play-button"></div>

    </div>

    <div id="status">PAUSED</div>

</div>

<!-- AUDIO -->
<audio id="audio-player" loop>
    <source src="video.mp3" type="audio/mpeg">
</audio>

<script>
/* =========================================
   AUDIO PLAYER
========================================= */

const audio = document.getElementById('audio-player');
const playButton = document.getElementById('play-button');
const statusText = document.getElementById('status');

let isPlaying = false;

playButton.addEventListener('click', () => {

    if (!isPlaying) {
        audio.play();

        statusText.innerText = 'PLAYING';

        startVisualizer();

    } else {
        audio.pause();

        statusText.innerText = 'PAUSED';

        stopVisualizer();
    }

    isPlaying = !isPlaying;
});

/* =========================================
   VISUALIZER
========================================= */

const visualizer = document.getElementById('visualizer');

let bars = [];

function createBars() {

    visualizer.innerHTML = '';
    bars = [];

    const count = 32;

    for (let i = 0; i < count; i++) {

        const bar = document.createElement('div');

        bar.classList.add('bar');

        bar.style.left = `${i * 12}px`;

        bar.style.height = `${20 + Math.random() * 80}%`;

        bar.style.animationDelay = `${Math.random()}s`;

        bar.style.opacity = 0.5 + Math.random() * 0.5;

        visualizer.appendChild(bar);

        bars.push(bar);
    }
}

function startVisualizer() {

    createBars();

    bars.forEach(bar => {
        bar.style.animationPlayState = 'running';
    });
}

function stopVisualizer() {

    bars.forEach(bar => {
        bar.style.animationPlayState = 'paused';
    });
}

createBars();
stopVisualizer();

/* =========================================
   DRAGGABLE TV
========================================= */

const tvWidget = document.getElementById('tv-widget');

let offsetX = 0;
let offsetY = 0;
let isDragging = false;

tvWidget.addEventListener('mousedown', (e) => {

    isDragging = true;

    offsetX = e.clientX - tvWidget.offsetLeft;
    offsetY = e.clientY - tvWidget.offsetTop;

    tvWidget.style.transform = 'none';
});

document.addEventListener('mousemove', (e) => {

    if (!isDragging) return;

    tvWidget.style.left = `${e.clientX - offsetX}px`;
    tvWidget.style.top = `${e.clientY - offsetY}px`;
});

document.addEventListener('mouseup', () => {
    isDragging = false;
});

/* =========================================
   TOUCH SUPPORT
========================================= */

tvWidget.addEventListener('touchstart', (e) => {

    isDragging = true;

    const touch = e.touches[0];

    offsetX = touch.clientX - tvWidget.offsetLeft;
    offsetY = touch.clientY - tvWidget.offsetTop;

    tvWidget.style.transform = 'none';

}, { passive: true });

document.addEventListener('touchmove', (e) => {

    if (!isDragging) return;

    const touch = e.touches[0];

    tvWidget.style.left = `${touch.clientX - offsetX}px`;
    tvWidget.style.top = `${touch.clientY - offsetY}px`;

}, { passive: true });

document.addEventListener('touchend', () => {
    isDragging = false;
});

</script>

</body>
</html>
