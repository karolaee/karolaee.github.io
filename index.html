<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sunrise Rally Racing</title>

<style>
    html, body {
        margin: 0;
        overflow: hidden;
        background: #000;
        font-family: Arial, sans-serif;
    }

    canvas {
        display: block;
    }

    .info {
        position: absolute;
        top: 15px;
        left: 15px;
        color: white;
        background: rgba(0,0,0,0.35);
        padding: 12px 16px;
        border-radius: 12px;
        backdrop-filter: blur(6px);
        font-size: 14px;
        z-index: 10;
    }
</style>
</head>
<body>

<div class="info">
    Sunrise Rally Racing 🌅<br>
    Hover cars for fireworks 🎆<br>
    Move mouse in sky for birds 🕊️
</div>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let w, h, cx, cy;

function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
    cx = w / 2;
    cy = h / 2;
}
window.addEventListener("resize", resize);
resize();


// =====================================================
// TRACK SETTINGS
// =====================================================
const trackRadius = 340;
const trackWidth = 120;


// =====================================================
// CARS
// =====================================================
const cars = [
    { angle: 0, color: "#ff3b30" },
    { angle: Math.PI / 2, color: "#34c759" },
    { angle: Math.PI, color: "#007aff" },
    { angle: Math.PI * 1.5, color: "#ffcc00" }
];


// =====================================================
// EFFECT ARRAYS
// =====================================================
const fireworks = [];
const birds = [];


// =====================================================
// MOUSE
// =====================================================
const mouse = {
    x: 0,
    y: 0
};

canvas.addEventListener("mousemove", e => {

    mouse.x = e.clientX;
    mouse.y = e.clientY;

    // Outside track = sky area
    const dx = mouse.x - cx;
    const dy = mouse.y - cy;

    const distance = Math.sqrt(dx * dx + dy * dy);

    const outsideTrack =
        distance > trackRadius + trackWidth / 2;

    // Spawn birds
    if (outsideTrack && Math.random() < 0.6) {

        birds.push({
            x: mouse.x,
            y: mouse.y,
            vx: (Math.random() - 0.5) * 4,
            vy: -Math.random() * 2 - 1,
            size: Math.random() * 8 + 8,
            flap: Math.random() * Math.PI * 2,
            life: 220
        });
    }
});


// =====================================================
// FIREWORKS
// =====================================================
function createExplosion(x, y) {

    for (let i = 0; i < 45; i++) {

        fireworks.push({
            x,
            y,
            vx: (Math.random() - 0.5) * 10,
            vy: (Math.random() - 0.5) * 10,
            size: Math.random() * 4 + 2,
            color: `hsl(${Math.random() * 360},100%,60%)`,
            life: 100
        });
    }
}

function drawFireworks() {

    for (let i = fireworks.length - 1; i >= 0; i--) {

        const p = fireworks[i];

        p.x += p.vx;
        p.y += p.vy;

        p.vx *= 0.97;
        p.vy *= 0.97;

        p.life--;

        ctx.globalAlpha = p.life / 100;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();

        ctx.globalAlpha = 1;

        if (p.life <= 0) {
            fireworks.splice(i, 1);
        }
    }
}


// =====================================================
// BIRDS
// =====================================================
function drawBirds() {

    for (let i = birds.length - 1; i >= 0; i--) {

        const b = birds[i];

        b.x += b.vx;
        b.y += b.vy;

        b.life--;
        b.flap += 0.25;

        const wing = Math.sin(b.flap) * 6;

        ctx.save();

        ctx.translate(b.x, b.y);

        ctx.strokeStyle = "rgba(0,0,0,0.75)";
        ctx.lineWidth = 2;

        ctx.beginPath();

        // Left wing
        ctx.moveTo(-b.size, 0);
        ctx.quadraticCurveTo(
            -b.size / 2,
            -wing,
            0,
            0
        );

        // Right wing
        ctx.quadraticCurveTo(
            b.size / 2,
            -wing,
            b.size,
            0
        );

        ctx.stroke();

        ctx.restore();

        if (b.life <= 0) {
            birds.splice(i, 1);
        }
    }
}


// =====================================================
// SUNRISE SKY
// =====================================================
function drawSky() {

    // Sunrise gradient
    const gradient = ctx.createLinearGradient(
        0,
        0,
        0,
        h
    );

    gradient.addColorStop(0, "#2d1b4e");
    gradient.addColorStop(0.25, "#ff6b6b");
    gradient.addColorStop(0.55, "#ffb86b");
    gradient.addColorStop(1, "#ffe9b0");

    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, w, h);

    // Sun glow
    const sunX = cx;
    const sunY = h * 0.22;

    const sunGlow = ctx.createRadialGradient(
        sunX,
        sunY,
        20,
        sunX,
        sunY,
        180
    );

    sunGlow.addColorStop(0, "rgba(255,255,220,1)");
    sunGlow.addColorStop(0.25, "rgba(255,220,120,0.9)");
    sunGlow.addColorStop(1, "rgba(255,180,0,0)");

    ctx.fillStyle = sunGlow;

    ctx.beginPath();
    ctx.arc(sunX, sunY, 180, 0, Math.PI * 2);
    ctx.fill();

    // Sun
    ctx.beginPath();
    ctx.arc(sunX, sunY, 55, 0, Math.PI * 2);
    ctx.fillStyle = "#fff5c2";
    ctx.fill();

    // Clouds
    for (let i = 0; i < 7; i++) {

        const x =
            (i * 260 + Date.now() * 0.015) %
            (w + 400) - 200;

        const y = 70 + i * 55;

        ctx.fillStyle = "rgba(255,220,220,0.42)";

        ctx.beginPath();

        ctx.arc(x, y, 38, 0, Math.PI * 2);
        ctx.arc(x + 40, y + 10, 32, 0, Math.PI * 2);
        ctx.arc(x - 40, y + 10, 30, 0, Math.PI * 2);

        ctx.fill();
    }
}


// =====================================================
// TRACK
// =====================================================
function drawTrack() {

    // Asphalt
    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        trackRadius + trackWidth / 2,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = "#555";
    ctx.fill();

    // Grass center
    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        trackRadius - trackWidth / 2,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = "#2ea043";
    ctx.fill();

    // Racing line
    ctx.beginPath();

    ctx.setLineDash([16, 14]);

    ctx.arc(
        cx,
        cy,
        trackRadius,
        0,
        Math.PI * 2
    );

    ctx.strokeStyle = "white";
    ctx.lineWidth = 4;
    ctx.stroke();

    ctx.setLineDash([]);
}


// =====================================================
// CARS
// =====================================================
function drawCars() {

    cars.forEach(car => {

        car.angle += 0.004;

        const x =
            cx + Math.cos(car.angle) * trackRadius;

        const y =
            cy + Math.sin(car.angle) * trackRadius;

        // Driving direction
        const rotation =
            car.angle + Math.PI / 2;

        // Hover detection
        const dx = mouse.x - x;
        const dy = mouse.y - y;

        const dist =
            Math.sqrt(dx * dx + dy * dy);

        if (dist < 28 && Math.random() < 0.45) {
            createExplosion(x, y);
        }

        ctx.save();

        ctx.translate(x, y);
        ctx.rotate(rotation);

        // Shadow
        ctx.fillStyle = "rgba(0,0,0,0.25)";
        ctx.fillRect(-14, -28, 28, 56);

        // Car body
        ctx.fillStyle = car.color;
        ctx.fillRect(-12, -26, 24, 52);

        // Windshield
        ctx.fillStyle = "#dff3ff";
        ctx.fillRect(-8, -8, 16, 18);

        // Hood reflection
        ctx.fillStyle = "rgba(255,255,255,0.18)";
        ctx.fillRect(-8, -22, 16, 10);

        // Wheels
        ctx.fillStyle = "#111";

        ctx.fillRect(-16, -20, 5, 12);
        ctx.fillRect(11, -20, 5, 12);

        ctx.fillRect(-16, 8, 5, 12);
        ctx.fillRect(11, 8, 5, 12);

        // Headlights
        ctx.fillStyle = "#fff4aa";

        ctx.fillRect(-7, -28, 5, 4);
        ctx.fillRect(2, -28, 5, 4);

        // Rear lights
        ctx.fillStyle = "#ff4444";

        ctx.fillRect(-7, 24, 5, 4);
        ctx.fillRect(2, 24, 5, 4);

        ctx.restore();
    });
}


// =====================================================
// ANIMATION LOOP
// =====================================================
function animate() {

    requestAnimationFrame(animate);

    drawSky();

    drawBirds();

    drawTrack();

    drawCars();

    drawFireworks();
}

animate();

</script>
</body>
</html>
