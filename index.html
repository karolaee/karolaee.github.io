<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive SVG Widget</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            /* Background of the page */
            background: #222; 
            font-family: Arial, sans-serif;
        }

        #widget-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 500px;
            cursor: grab;
            user-select: none;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
        }

        #widget-container:active {
            cursor: grabbing;
        }

        /* The SVG under the PNG */
        #under-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: auto;
            z-index: 1;
            opacity: 0.5; /* Making it transparent as requested */
            pointer-events: none;
        }

        /* The PNG background layer */
        #bg-image {
            position: relative;
            width: 100%;
            height: auto;
            display: block;
            z-index: 2;
            pointer-events: none;
        }

        #video-overlay {
            position: absolute;
            /* Percentages based on the original SVG coordinate system (2000x2000) */
            top: 25.55%;    
            left: 23.52%;   
            width: 55.57%;  
            height: 31.76%; 
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            z-index: 3; /* On top of PNG */
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Buttons on top of everything */
        #controls-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: auto;
            z-index: 4;
            pointer-events: none; /* Allow clicks to pass through to buttons */
        }

        .interactive-btn {
            cursor: pointer;
            pointer-events: auto;
            transition: opacity 0.2s, transform 0.1s;
        }

        .interactive-btn:hover {
            opacity: 0.8;
        }

        .interactive-btn:active {
            transform: scale(0.95);
            transform-origin: center;
        }

        /* Visual state for play/pause */
        .playing #play-icon {
            display: none;
        }
        .playing #pause-icon {
            display: block;
        }
        #pause-icon {
            display: none;
        }
    </style>
</head>
<body>

    <div id="widget-container">
        <!-- 1. mv22.svg (Transparent, Underneath) -->
        <img id="under-svg" src="mv22.svg" alt="Background SVG">

        <!-- 2. mv22.png (Middle Layer) -->
        <img id="bg-image" src="mv22.png" alt="Background PNG">

        <!-- 3. Video Overlay (On top of PNG) -->
        <div id="video-overlay">
            <video id="myVideo" preload="auto" loop>
                <source src="video.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>

        <!-- 4. Controls SVG (Top Layer - Only Buttons) -->
        <svg id="controls-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 2000">
            <defs>
                <style>
                    .st0 { fill: #010101; }
                </style>
            </defs>
            
            <!-- Play button group -->
            <g id="_x3C_Play_button_x3E_" class="interactive-btn">
                <rect x="1140" y="1390" width="80" height="80" fill="transparent" />
                <polygon id="play-icon" class="st0" points="1210.28 1432.44 1150.48 1397.92 1150.48 1466.94 1210.28 1432.44"/>
                <g id="pause-icon" class="st0">
                    <rect x="1150" y="1400" width="20" height="65" />
                    <rect x="1185" y="1400" width="20" height="65" />
                </g>
            </g>

            <!-- Forward button -->
            <polygon id="_x3C_Forward_button_x3E_" class="interactive-btn st0" points="991.27 1397.92 991.27 1429.77 936.1 1397.92 936.1 1421.27 895.66 1397.92 895.66 1466.94 936.1 1443.59 936.1 1466.94 991.27 1435.09 991.27 1466.94 1003.36 1466.94 1003.36 1397.92 991.27 1397.92"/>
        </svg>
    </div>

    <script>
        const widget = document.getElementById('widget-container');
        const video = document.getElementById('myVideo');
        const playBtn = document.getElementById('_x3C_Play_button_x3E_');
        const forwardBtn = document.getElementById('_x3C_Forward_button_x3E_');

        // --- Video Controls ---
        playBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (video.paused) {
                video.play();
                playBtn.classList.add('playing');
            } else {
                video.pause();
                playBtn.classList.remove('playing');
            }
        });

        video.addEventListener('ended', () => {
            playBtn.classList.remove('playing');
        });

        forwardBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            video.currentTime += 5;
        });

        // --- Draggable Logic ---
        let isDragging = false;
        let currentX = 0;
        let currentY = 0;
        let initialX;
        let initialY;
        let xOffset = 0;
        let yOffset = 0;

        widget.addEventListener('mousedown', dragStart);
        document.addEventListener('mousemove', drag);
        document.addEventListener('mouseup', dragEnd);

        function dragStart(e) {
            // Only drag if not clicking interactive buttons
            if (e.target.closest('.interactive-btn')) return;

            initialX = e.clientX - xOffset;
            initialY = e.clientY - yOffset;
            isDragging = true;
        }

        function drag(e) {
            if (isDragging) {
                e.preventDefault();
                currentX = e.clientX - initialX;
                currentY = e.clientY - initialY;
                xOffset = currentX;
                yOffset = currentY;
                setTranslate(currentX, currentY, widget);
            }
        }

        function setTranslate(xPos, yPos, el) {
            el.style.transform = `translate(calc(-50% + ${xPos}px), calc(-50% + ${yPos}px))`;
        }

        function dragEnd(e) {
            initialX = currentX;
            initialY = currentY;
            isDragging = false;
        }

        // Support for touch devices
        widget.addEventListener('touchstart', (e) => {
            const touch = e.touches[0];
            dragStart({
                clientX: touch.clientX,
                clientY: touch.clientY,
                target: e.target
            });
        });
        document.addEventListener('touchmove', (e) => {
            const touch = e.touches[0];
            drag({
                clientX: touch.clientX,
                clientY: touch.clientY,
                preventDefault: () => e.preventDefault()
            });
        }, { passive: false });
        document.addEventListener('touchend', dragEnd);

    </script>
</body>
</html>
