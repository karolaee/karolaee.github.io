<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rally Racing Fireworks</title>
  <style>
    html, body {
      margin: 0;
      overflow: hidden;
      background: #111;
      font-family: Arial, sans-serif;
    }

    canvas {
      display: block;
      cursor: crosshair;
    }

    .label {
      position: absolute;
      top: 15px;
      left: 15px;
      color: white;
      background: rgba(0,0,0,0.4);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 14px;
      backdrop-filter: blur(5px);
    }
  </style>
</head>
<body>

<div class="label">
  Hover over a rally car to trigger fireworks 🎆
</div>

<canvas id="scene"></canvas>

<script>
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');

let w, h, centerX, centerY;

function resize() {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
  centerX = w / 2;
  centerY = h / 2;
}
window.addEventListener('resize', resize);
resize();

// =========================
// TRACK
// =========================
const trackRadius = 230;
const trackWidth = 90;

// =========================
// CARS
// =========================
const cars = [
  { angle: 0, color: '#ff3b30', fireworks: false },
  { angle: Math.PI / 2, color: '#34c759', fireworks: false },
  { angle: Math.PI, color: '#007aff', fireworks: false },
  { angle: Math.PI * 1.5, color: '#ffcc00', fireworks: false }
];

const carSize = 18;

// =========================
// FIREWORKS
// =========================
const particles = [];

function createExplosion(x, y) {
  for (let i = 0; i < 40; i++) {
    particles.push({
      x,
      y,
      vx: (Math.random() - 0.5) * 8,
      vy: (Math.random() - 0.5) * 8,
      life: 100,
      color: `hsl(${Math.random() * 360},100%,60%)`
    });
  }
}

// =========================
// MOUSE
// =========================
const mouse = { x: 0, y: 0 };

canvas.addEventListener('mousemove', (e) => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});

// =========================
// DRAW TRACK
// =========================
function drawTrack() {
  // Outer track
  ctx.beginPath();
  ctx.arc(centerX, centerY, trackRadius + trackWidth / 2, 0, Math.PI * 2);
  ctx.fillStyle = '#555';
  ctx.fill();

  // Inner grass
  ctx.beginPath();
  ctx.arc(centerX, centerY, trackRadius - trackWidth / 2, 0, Math.PI * 2);
  ctx.fillStyle = '#1b5e20';
  ctx.fill();

  // Dashed center line
  ctx.beginPath();
  ctx.setLineDash([12, 12]);
  ctx.arc(centerX, centerY, trackRadius, 0, Math.PI * 2);
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 3;
  ctx.stroke();
  ctx.setLineDash([]);
}

// =========================
// DRAW CARS
// =========================
function drawCars() {
  cars.forEach(car => {

    // Animate movement
    car.angle += 0.003;

    const x = centerX + Math.cos(car.angle) * trackRadius;
    const y = centerY + Math.sin(car.angle) * trackRadius;

    car.x = x;
    car.y = y;

    // Hover detection
    const dx = mouse.x - x;
    const dy = mouse.y - y;
    const dist = Math.sqrt(dx * dx + dy * dy);

    car.fireworks = dist < 22;

    // Car body
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(car.angle + Math.PI / 2);

    ctx.fillStyle = car.color;
    ctx.fillRect(-10, -18, 20, 36);

    // windshield
    ctx.fillStyle = '#cfe8ff';
    ctx.fillRect(-7, -10, 14, 12);

    // wheels
    ctx.fillStyle = '#111';
    ctx.fillRect(-13, -14, 4, 8);
    ctx.fillRect(9, -14, 4, 8);
    ctx.fillRect(-13, 6, 4, 8);
    ctx.fillRect(9, 6, 4, 8);

    ctx.restore();

    // Fireworks trigger
    if (car.fireworks && Math.random() < 0.4) {
      createExplosion(x, y);
    }
  });
}

// =========================
// DRAW PARTICLES
// =========================
function drawParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];

    p.x += p.vx;
    p.y += p.vy;

    p.vx *= 0.98;
    p.vy *= 0.98;

    p.life--;

    ctx.beginPath();
    ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.life / 100;
    ctx.fill();
    ctx.globalAlpha = 1;

    if (p.life <= 0) {
      particles.splice(i, 1);
    }
  }
}

// =========================
// BACKGROUND
// =========================
function drawBackground() {
  const gradient = ctx.createRadialGradient(
    centerX,
    centerY,
    100,
    centerX,
    centerY,
    w
  );

  gradient.addColorStop(0, '#222');
  gradient.addColorStop(1, '#000');

  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, w, h);
}

// =========================
// MAIN LOOP
// =========================
function animate() {
  requestAnimationFrame(animate);

  drawBackground();
  drawTrack();
  drawCars();
  drawParticles();
}

animate();
</script>

</body>
</html>
