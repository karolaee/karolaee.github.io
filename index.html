<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Lightning McQueen TV</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100vw;
    height:100vh;
    overflow:hidden;

    display:flex;
    justify-content:center;
    align-items:center;

    background:
        linear-gradient(rgba(0,0,0,.35), rgba(0,0,0,.55)),
        url("wallpaper.jpg");

    background-size:cover;
    background-position:center;

    perspective:1800px;

    font-family:Arial, sans-serif;
}

/* MAIN TV */

.tv-wrapper{
    position:relative;
    width:min(92vw,1200px);

    transform-style:preserve-3d;

    animation:floatTV 6s ease-in-out infinite;
}

@keyframes floatTV{
    0%{
        transform:
            rotateX(2deg)
            rotateY(-3deg)
            translateY(0px);
    }

    50%{
        transform:
            rotateX(-2deg)
            rotateY(3deg)
            translateY(-10px);
    }

    100%{
        transform:
            rotateX(2deg)
            rotateY(-3deg)
            translateY(0px);
    }
}

/* SVG TV */

#mcqueenTV{
    width:100%;
    display:block;
    position:relative;
    z-index:5;

    filter:
        drop-shadow(0 25px 50px rgba(0,0,0,.7))
        drop-shadow(0 0 35px rgba(255,0,0,.25));
}

/* VIDEO SCREEN */

.video-screen{
    position:absolute;

    /*
      ADJUST THESE VALUES
      TO PERFECTLY FIT YOUR SVG SCREEN
    */

    top:19%;
    left:18%;
    width:64%;
    height:46%;

    border-radius:18px;
    overflow:hidden;

    z-index:2;

    background:black;

    box-shadow:
        inset 0 0 50px rgba(0,0,0,.8),
        0 0 30px rgba(255,0,0,.35);

    transform:
        translateZ(20px);
}

video{
    width:100%;
    height:100%;
    object-fit:cover;

    filter:
        contrast(1.1)
        saturate(1.2)
        brightness(.95);
}

/* CRT EFFECT */

.crt{
    position:absolute;
    inset:0;

    pointer-events:none;

    background:
        repeating-linear-gradient(
            to bottom,
            rgba(255,255,255,.04),
            rgba(255,255,255,.04) 2px,
            transparent 2px,
            transparent 4px
        );

    mix-blend-mode:overlay;
}

/* SCREEN REFLECTION */

.reflection{
    position:absolute;
    inset:0;

    background:
        linear-gradient(
            130deg,
            rgba(255,255,255,.20),
            transparent 30%
        );

    pointer-events:none;
}

/* HEADLIGHTS */

.headlight{
    position:absolute;

    width:90px;
    height:90px;

    border-radius:50%;

    background:
        radial-gradient(circle,
        rgba(255,255,220,.95) 0%,
        rgba(255,220,120,.55) 35%,
        rgba(255,120,0,.08) 70%,
        transparent 100%);

    opacity:0;

    transition:.4s ease;

    filter:blur(8px);

    z-index:1;
}

/* LEFT HEADLIGHT */
.left-light{
    left:7%;
    top:53%;
}

/* RIGHT HEADLIGHT */
.right-light{
    right:7%;
    top:53%;
}

.headlight.active{
    opacity:1;

    box-shadow:
        0 0 25px #fff7aa,
        0 0 55px orange,
        0 0 100px red;
}

/* BUTTON HITBOXES */

.button{
    position:absolute;
    z-index:20;

    cursor:pointer;

    border-radius:50%;

    transition:.15s;
}

.button:hover{
    transform:scale(1.08);

    background:rgba(255,255,255,.08);
}

.button:active{
    transform:scale(.94);
}

/*
  PLAY BUTTON
  MAP THIS TO SVG PLAY BUTTON AREA
*/

#playButton{
    width:70px;
    height:70px;

    right:14%;
    bottom:16%;
}

/*
  FORWARD BUTTON
  NO FUNCTION
*/

#forwardButton{
    width:70px;
    height:70px;

    right:5%;
    bottom:16%;
}

/* GLOW WHEN PLAYING */

.playing #mcqueenTV{
    filter:
        drop-shadow(0 25px 50px rgba(0,0,0,.7))
        drop-shadow(0 0 60px rgba(255,0,0,.45))
        drop-shadow(0 0 100px orange);
}

</style>
</head>

<body>

<div class="tv-wrapper" id="tvWrapper">

    <!-- HEADLIGHT GLOW -->
    <div class="headlight left-light" id="leftLight"></div>
    <div class="headlight right-light" id="rightLight"></div>

    <!-- VIDEO SCREEN -->
    <div class="video-screen">

        <video id="mcqueenVideo" loop playsinline>
            <source src="video.mp4" type="video/mp4">
        </video>

        <div class="crt"></div>
        <div class="reflection"></div>

    </div>

    <!-- SVG TV -->
    <img src="mv2.svg" id="mcqueenTV">

    <!-- PLAY BUTTON -->
    <div class="button" id="playButton"></div>

    <!-- FORWARD BUTTON -->
    <div class="button" id="forwardButton"></div>

</div>

<script>

const video = document.getElementById("mcqueenVideo");

const playButton = document.getElementById("playButton");

const leftLight = document.getElementById("leftLight");
const rightLight = document.getElementById("rightLight");

const wrapper = document.getElementById("tvWrapper");

/* PLAY / PAUSE */

playButton.addEventListener("click", () => {

    if(video.paused){

        video.play();

        leftLight.classList.add("active");
        rightLight.classList.add("active");

        wrapper.classList.add("playing");

    }else{

        video.pause();

        leftLight.classList.remove("active");
        rightLight.classList.remove("active");

        wrapper.classList.remove("playing");
    }

});

/* OPTIONAL:
   CLICK SCREEN TO PLAY/PAUSE
*/

document.querySelector(".video-screen")
.addEventListener("click", () => {

    playButton.click();

});

</script>

</body>
</html>
