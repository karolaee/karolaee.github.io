<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Top View Rally Racing</title>

<style>
    html, body {
        margin: 0;
        overflow: hidden;
        background: #0a0a0a;
        font-family: Arial, sans-serif;
    }

    canvas {
        display: block;
    }

    .info {
        position: absolute;
        top: 15px;
        left: 15px;
        color: white;
        background: rgba(0,0,0,0.45);
        padding: 12px 16px;
        border-radius: 12px;
        backdrop-filter: blur(6px);
        font-size: 14px;
    }
</style>
</head>
<body>

<div class="info">
    Hover over a car to launch fireworks 🎆
</div>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let w, h, cx, cy;

function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
    cx = w / 2;
    cy = h / 2;
}
window.addEventListener("resize", resize);
resize();


// =====================================
// BIGGER TRACK
// =====================================
const trackRadius = 340;
const trackWidth = 120;


// =====================================
// CARS
// =====================================
const cars = [
    { angle: 0, color: "#ff3b30" },
    { angle: Math.PI / 2, color: "#34c759" },
    { angle: Math.PI, color: "#007aff" },
    { angle: Math.PI * 1.5, color: "#ffcc00" }
];

const particles = [];
const mouse = { x: 0, y: 0 };

canvas.addEventListener("mousemove", e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
});


// =====================================
// FIREWORKS
// =====================================
function createExplosion(x, y) {
    for (let i = 0; i < 45; i++) {
        particles.push({
            x,
            y,
            vx: (Math.random() - 0.5) * 10,
            vy: (Math.random() - 0.5) * 10,
            size: Math.random() * 4 + 2,
            life: 100,
            color: `hsl(${Math.random() * 360},100%,60%)`
        });
    }
}

function drawParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];

        p.x += p.vx;
        p.y += p.vy;

        p.vx *= 0.97;
        p.vy *= 0.97;

        p.life--;

        ctx.globalAlpha = p.life / 100;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();

        ctx.globalAlpha = 1;

        if (p.life <= 0) {
            particles.splice(i, 1);
        }
    }
}


// =====================================
// BACKGROUND
// =====================================
function drawBackground() {
    const gradient = ctx.createRadialGradient(
        cx, cy, 100,
        cx, cy, w
    );

    gradient.addColorStop(0, "#1c1c1c");
    gradient.addColorStop(1, "#000");

    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, w, h);
}


// =====================================
// TRACK
// =====================================
function drawTrack() {

    // Outer asphalt
    ctx.beginPath();
    ctx.arc(cx, cy, trackRadius + trackWidth / 2, 0, Math.PI * 2);
    ctx.fillStyle = "#555";
    ctx.fill();

    // Inner grass
    ctx.beginPath();
    ctx.arc(cx, cy, trackRadius - trackWidth / 2, 0, Math.PI * 2);
    ctx.fillStyle = "#1f7a1f";
    ctx.fill();

    // Racing line
    ctx.beginPath();
    ctx.setLineDash([16, 14]);
    ctx.arc(cx, cy, trackRadius, 0, Math.PI * 2);
    ctx.strokeStyle = "white";
    ctx.lineWidth = 4;
    ctx.stroke();
    ctx.setLineDash([]);
}


// =====================================
// CAR DRAWING
// =====================================
function drawCars() {

    cars.forEach(car => {

        // Move car
        car.angle += 0.004;

        const x = cx + Math.cos(car.angle) * trackRadius;
        const y = cy + Math.sin(car.angle) * trackRadius;

        car.x = x;
        car.y = y;

        // Hover detection
        const dx = mouse.x - x;
        const dy = mouse.y - y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < 28 && Math.random() < 0.5) {
            createExplosion(x, y);
        }

        // =====================================
        // IMPORTANT:
        // rotate FORWARD direction
        // =====================================
        const rotation = car.angle + Math.PI / 2;

        ctx.save();

        ctx.translate(x, y);
        ctx.rotate(rotation);

        // Shadow
        ctx.fillStyle = "rgba(0,0,0,0.35)";
        ctx.fillRect(-14, -28, 28, 56);

        // Car body
        ctx.fillStyle = car.color;
        ctx.fillRect(-12, -26, 24, 52);

        // Hood
        ctx.fillStyle = "#ffffff22";
        ctx.fillRect(-8, -20, 16, 12);

        // Roof
        ctx.fillStyle = "#d6ecff";
        ctx.fillRect(-8, -6, 16, 18);

        // Back glass
        ctx.fillStyle = "#ffffff22";
        ctx.fillRect(-8, 16, 16, 8);

        // Wheels
        ctx.fillStyle = "#111";

        ctx.fillRect(-16, -20, 5, 12);
        ctx.fillRect(11, -20, 5, 12);

        ctx.fillRect(-16, 8, 5, 12);
        ctx.fillRect(11, 8, 5, 12);

        // Front headlights
        ctx.fillStyle = "#fff8b0";
        ctx.fillRect(-8, -28, 5, 4);
        ctx.fillRect(3, -28, 5, 4);

        // Rear lights
        ctx.fillStyle = "#ff3b30";
        ctx.fillRect(-8, 24, 5, 4);
        ctx.fillRect(3, 24, 5, 4);

        ctx.restore();
    });
}


// =====================================
// ANIMATION
// =====================================
function animate() {

    requestAnimationFrame(animate);

    drawBackground();
    drawTrack();
    drawCars();
    drawParticles();
}

animate();

</script>
</body>
</html>
